</style></head><body><div class="wrap"><header><small>ISABELL · Choose to Own Your Adventure™</small><h1>Chapter Five</h1><div class="eyebrow">The Choice at the Crossroads</div></header><main><div class="scene" role="img" aria-label="Illustrated glowing forest crossroads"></div><div id="progress" class="progress"></div><div id="saveStatus" role="status" class="muted">Connecting to your Story Vault…</div><div id="screen" aria-live="polite"></div></main><p class="muted" style="text-align:center">Chapter Five · Your save status appears above the story.</p></div><script>(()=>{'use strict';const KEY='ctya_chapter5_'+(localStorage.getItem('ctya_story_id')||'missing'), API='https://remembering-story-api.choosetoownyouradventure.workers.dev', CHAPTER='choice_crossroads', VERSION='chapter5-v1', storyId=localStorage.getItem('ctya_story_id')||'', token=localStorage.getItem('ctya_resume_token')||'';let source={},serverReady=false,expired=false,saveTimer=null,saveChain=Promise.resolve(),lastSaved='';const status=(message)=>{$('saveStatus').textContent=message};const paths={thread:{title:'Follow the Thread',intro:'A fine golden thread glimmers between the trees. It does not pull you. It simply waits to be noticed.',question:'What is asking for your attention now?',options:['A question I want to understand','A gift I want to express','A truth I have been avoiding','I am not sure yet']},new:{title:'Choose a New Path',intro:'A path you have never walked opens beneath the morning light. You do not need to know the whole route to choose one step.',question:'Where might you make a different choice?',options:['Protect time for my own meaningful work','Express a need or boundary','Ask for support','Take one small creative step','I am not sure yet']},rest:{title:'Rest at the Crossroads',intro:'Beside the path is a quiet place to sit. Nothing asks you to prove that you deserve to stop.',question:'What would make rest a choice that belongs to you?',options:['Give myself permission to pause','Notice what I need before deciding','Set aside a nonurgent demand','Choose a gentle moment of care','I am not sure yet']}};let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch{}s=s&&s.version===1?s:{version:1,screen:'opening',name:'',path:null,explored:{},notes:{},choices:{},commitment:'',support:'',measure:'',finished:false};const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(s));if(serverReady&&!s.finished&&!expired){status('Saving your adventure…');clearTimeout(saveTimer);saveTimer=setTimeout(()=>persist(false),450)}}
function persist(complete=false,restart=false){clearTimeout(saveTimer);if(!serverReady&&!restart)return Promise.resolve(false);const snapshot=JSON.stringify({resume_token:token,version:VERSION,status:complete?'complete':'in_progress',restart,answers:{client:s},result:buildResult()});saveChain=saveChain.catch(()=>{}).then(async()=>{status('Saving your adventure…');try{const r=await fetch(`${API}/stories/${encodeURIComponent(storyId)}/chapters/${CHAPTER}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:snapshot});const d=await r.json();if(!r.ok||!d.success){if(d.expired)expired=true;throw Error(d.error||'Save failed')}lastSaved=d.saved_at||'';status(complete?'Chapter Five saved to your Story Vault.':'Your choices are saved in your Story Vault.');return true}catch(e){status('Your answers remain in this browser, but the Story Vault save was not confirmed: '+e.message);return false}});return saveChain}
function buildResult(){const c=s.choices||{},n=s.notes||{};return {chosen_path:s.path||null,discovery:c[s.path]||null,discovery_client_words:n[s.path]||null,chosen_action:n.action||null,constraint:n.constraint||null,support:n.support||null,success_indicator:n.measure||null,imagined_future:n.prediction||null,explored_paths:Object.keys(s.explored||{}).filter(k=>s.explored[k]),source_chapter_four:source,practitioner:{client_evidence:{chosen_path:s.path||null,discovery:c[s.path]||null,chosen_action:n.action||null,constraint:n.constraint||null,support:n.support||null,success_indicator:n.measure||null,imagined_future:n.prediction||null},interpretation:'Not generated; practitioner to explore with client.',follow_up_questions:['What happened when you tried your chosen action or pause?','Did your boundaries and constraints receive the respect they needed?']}}}function go(x){s.screen=x;save();render();scrollTo(0,0)}function btn(label,fn,cls='secondary'){let b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=fn;return b}function add(label,fn,cls){$('screen').append(btn(label,fn,cls))}function heading(title,text){$('screen').innerHTML=`<h2>${title}</h2><p>${text}</p>`}function field(label,key,placeholder='Your own words…'){let l=document.createElement('label');l.textContent=label;let t=document.createElement('textarea');t.placeholder=placeholder;t.value=s.notes[key]||'';t.oninput=()=>{s.notes[key]=t.value;save()};$('screen').append(l,t)}function options(items,key){items.forEach((v,i)=>{let b=btn(v,()=>{s.choices[key]=v;save();render()},'choice'+(s.choices[key]===v?' selected':''));b.setAttribute('aria-pressed',String(s.choices[key]===v));$('screen').append(b)})}function nav(back,next,enabled=true){let d=document.createElement('div');d.className='actions';d.append(btn('← Back',()=>go(back)));let n=btn('Turn the page →',()=>go(next),'primary');n.disabled=!enabled;d.append(n);$('screen').append(d)}function render(){let p=s.path,config=paths[p];$('progress').textContent=s.finished?'Chapter Five · Your closing page':s.screen==='opening'?'Chapter Five · Opening':s.screen==='crossroads'?'Chapter Five · The crossroads':s.screen==='path'?'Chapter Five · Exploring':s.screen==='choice'?'Chapter Five · Choosing':'Chapter Five · Integration';if(s.screen==='opening'){heading('The road remembers','You have named an old sentence, chosen new words, and noticed how a familiar moment can feel in your body. Now the road opens before you. You do not have to rush, prove anything, or know the ending.');$('screen').innerHTML+='<p class="quote">A choice can be small and still belong to you.</p>';add('Enter the crossroads →',()=>go('crossroads'),'primary')}else if(s.screen==='crossroads'){heading('Three paths. One traveler.','You may walk down each path to see what it reveals, then return here. Exploring is not a commitment. Your words will wait for you.');Object.entries(paths).forEach(([id,c])=>add((s.explored[id]?'✦ ':'◇ ')+c.title,()=>{s.path=id;save();go('path')},'choice'));if(s.path&&s.explored[s.path])add('Continue with '+paths[s.path].title+' →',()=>go('choice'),'primary')}else if(s.screen==='path'){heading(config.title,config.intro);$('screen').innerHTML+=`<p><strong>${config.question}</strong></p>`;options(config.options,p);field('What would you like to add? (optional)',p);add('Save this exploration and return to the crossroads',()=>{s.explored[p]=true;save();go('crossroads')});add('Choose this path →',()=>{if(!s.choices[p])return;s.explored[p]=true;save();go('choice')},'primary')}else if(s.screen==='choice'){heading('The choice belongs to you',`You explored <strong>${esc(config.title)}</strong>. You can still change your mind.`);$('screen').innerHTML+=`<div class="quote">${esc(s.choices[p]||'Your choice is still taking shape.')}</div>`;field('What is one small, realistic action—or intentional pause—you choose?', 'action','I choose to…');field('What real-life limitations, responsibilities, or personal boundaries does your next step need to respect? (optional)','constraint','For example: time, energy, finances, safety, or no particular constraints.');add('Explore another path',()=>go('crossroads'));add('Carry this choice forward →',()=>{if(!(s.notes.action||'').trim()){alert('Name a small action or intentional pause in your own words.');return}go('integration')},'primary')}else if(s.screen==='integration'){heading('Carry only what is yours','A choice is not a promise that everything will go perfectly. Give yourself a manageable way to notice what happens next.');field('What support, boundary, or reminder might help? (optional)','support');field('What would tell you this choice was useful to you? (optional)','measure');field('What do you imagine might happen? (optional)','prediction');add('← Revisit my choice',()=>go('choice'));add('Complete my chapter →',async()=>{if(!s.path||!s.choices[s.path]||!(s.notes.action||'').trim()){status('Choose a path and name your next action or pause first.');return}const ok=await persist(true);if(ok){s.finished=true;s.screen='complete';localStorage.setItem(KEY,JSON.stringify(s));render();scrollTo(0,0)}},'primary')}else{let title=paths[s.path]?.title||'Your path';heading('The Adventure Is Yours','The three paths meet in a golden clearing. You reach into your pocket and find the keepsake you have carried through your story. It has not chosen your road for you. It reminds you that the choice was yours all along.');let text=`You look back toward the path you chose: ${title}. Along the way, you noticed ${s.choices[s.path]||'something still taking shape'}.${s.notes[s.path]?' In your own words: '+s.notes[s.path]:''}\n\nNow you choose your next step or intentional pause: ${s.notes.action?'“'+s.notes.action.replace(/[.!?]+$/,'')+'”':'still taking shape'}. ${s.notes.constraint?'You named a boundary or limitation to honor: “'+s.notes.constraint.replace(/[.!?]+$/,'')+'.”':'You may name the practical boundaries your next step needs as they become clear.'}\n\nYou gather the support you named for the journey: ${s.notes.support?'“'+s.notes.support.replace(/[.!?]+$/,'')+'”':'support you may choose to identify as you continue'}. ${s.notes.measure?'You chose to pay attention to: “'+s.notes.measure.replace(/[.!?]+$/,'')+'.”':''} ${s.notes.prediction?'Looking beyond the clearing, you imagine: “'+s.notes.prediction.replace(/[.!?]+$/,'')+'.” This is a vision, not a promise.':''}\n\nYou close your hand around the keepsake. You have not reached the end of your adventure. You have reached the place where your choices begin to shape the next chapter. And this time, you are holding the pen.`;let pre=document.createElement('div');pre.className='summary';let subtitle=document.createElement('h3');subtitle.className='keepsake-subtitle';subtitle.textContent='The Lightbearer at the Golden Clearing';pre.append(subtitle,document.createTextNode(text));$('screen').append(pre);add('Print / save this chapter',()=>print(),'primary');add('Revisit my crossroads',()=>{showCompletedCrossroads();});add('Begin my seven-day practice →',()=>showPracticeSetup(),'primary');add('Copy my keepsake',async()=>{try{await navigator.clipboard.writeText('The Lightbearer at the Golden Clearing\n\n'+text);alert('Keepsake copied.')}catch{alert('Select the keepsake text to copy it.')}})}  }
function localToday(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function practiceBack(){s.screen='complete';render();status('Your completed chapter remains unchanged.');scrollTo(0,0)}
async function showPracticeSetup(){
  $('progress').textContent='Chapter Five · Seven-day practice';
  $('screen').innerHTML='<h2>Your seven-day practice</h2><p>Choose when you would like to try your own action once a day for seven days. You can adapt it to your needs. This is optional and will not change your completed chapter.</p>';
  const action=document.createElement('p');action.className='quote';action.textContent='Your chosen action or intentional pause: '+(s.notes?.action||'Not recorded');$('screen').append(action);
  const content=document.createElement('div');$('screen').append(content);
  add('← Return to my keepsake',practiceBack);
  status('Checking whether you already registered a practice…');
  try{
    const r=await fetch(`${API}/stories/${encodeURIComponent(storyId)}/practices`,{headers:{'X-Story-Token':token},cache:'no-store'});
    const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'Could not check your practice');
    if(!content.isConnected)return;
    const existing=Array.isArray(d.practices)?d.practices:[];
    if(existing.length){const p=existing[0];content.innerHTML='<h3>Your practice is registered</h3>';const detail=document.createElement('p');detail.textContent='Daily time: '+p.daily_time+'. Start: '+p.start_date+'. Seven-day reflection opens: '+p.review_date+'.';content.append(detail);const reminder=document.createElement('p');reminder.className='muted';reminder.textContent=p.reminder_consent===1?'You requested one manual email reminder. It is not sent automatically.':'No email reminder was requested for this registration. You can still return for your reflection.';content.append(reminder);const reviewButton=btn(p.next_choice?'Read my saved reflection →':'Open my seven-day reflection →',()=>showPracticeReview(p),'primary');content.append(reviewButton);status('Your existing practice was found. No duplicate was created.');return}
    content.innerHTML='';
    const form=document.createElement('form');form.setAttribute('novalidate','');
    const label=document.createElement('label');label.textContent='When would you prefer to practice each day?';
    const time=document.createElement('select');time.required=true;time.style.cssText='display:block;width:100%;padding:12px;background:#0b1a2a;color:white;border:1px solid #a48a5b;border-radius:9px;font:inherit';
    [['','Choose a time'],['morning','Morning'],['midday','Midday'],['evening','Evening'],['flexible','Flexible']].forEach(([value,text])=>{const o=document.createElement('option');o.value=value;o.textContent=text;time.append(o)});
    const fallbackLabel=document.createElement('label');fallbackLabel.textContent='If your original plan is not possible, what smaller, manageable version could you try?';
    const fallback=document.createElement('textarea');fallback.required=true;fallback.maxLength=1500;fallback.placeholder='My gentler alternative is…';
    const consentLabel=document.createElement('label');consentLabel.style.cssText='display:flex;align-items:flex-start;gap:12px;cursor:pointer';const consent=document.createElement('input');consent.type='checkbox';consent.style.cssText='width:22px;height:22px;flex:none;margin-top:5px';const consentText=document.createElement('span');consentText.textContent='Yes, I would like one personal email reminder when my 7-Day Challenge reflection is ready. This is optional and is not consent to marketing emails.';consentLabel.append(consent,consentText);
    const note=document.createElement('p');note.className='muted';note.textContent='Your practice starts on the day you register. Your seven-day reflection becomes available seven days later. If you opt in, your reminder request will be saved for manual follow-up; an email is not automatically sent or guaranteed. No appointments are booked.';
    const submit=btn('Register my seven-day practice →',()=>{},'primary');submit.type='submit';submit.onclick=null;
    form.append(label,time,fallbackLabel,fallback,consentLabel,note,submit);content.append(form);
    form.onsubmit=async e=>{e.preventDefault();if(!time.value||!fallback.value.trim()){status('Choose a daily time and write your smaller fallback action.');return}submit.disabled=true;status('Registering your practice…');try{const r=await fetch(`${API}/stories/${encodeURIComponent(storyId)}/practices`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({resume_token:token,daily_time:time.value,fallback_action:fallback.value.trim(),start_date:localToday(),reminder_consent:consent.checked})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'Registration could not be confirmed');content.innerHTML='<h3>Your practice is registered</h3>';const result=document.createElement('p');result.textContent='Your seven-day reflection opens on '+d.review_date+'. Your completed chapter is unchanged.';content.append(result);const reminder=document.createElement('p');reminder.className='muted';reminder.textContent=consent.checked?'Your request for one manual email reminder was saved. It is not automatically sent.':'You did not request an email reminder.';content.append(reminder);const reviewButton=btn('Open my seven-day reflection →',()=>showPracticeSetup(),'primary');content.append(reviewButton);status('Practice saved to your Story Vault.')}catch(err){submit.disabled=false;status('Practice was not confirmed: '+err.message+'. Your completed chapter is safe.')}};
    status('Choose your daily time and a fallback action to register.');

async function showPracticeReview(practice){
  $('progress').textContent='Chapter Five · Seven-day reflection';
  $('screen').innerHTML='';
  heading('What did your choice teach you?','Seven days of trying, adapting, or resting can offer useful information. This reflection is yours. There is no required outcome and no obligation to request coaching.');
  const action=document.createElement('p');action.className='quote';action.textContent='Your chosen action or pause: '+practice.chosen_action;$('screen').append(action);
  const dates=document.createElement('p');dates.className='muted';dates.textContent='Practice began '+practice.start_date+' · Reflection opens '+practice.review_date;$('screen').append(dates);
  const content=document.createElement('div');$('screen').append(content);
  add('← Return to my practice',showPracticeSetup);
  if(practice.next_choice){
    content.innerHTML='<h3>Your reflection is safely recorded</h3>';
    const rows=[['Days practiced',practice.days_practiced+' of 7'],['What happened',practice.observed_outcome],['Mind and body',practice.mind_body_reflection],['Supports and obstacles',practice.supports_obstacles],['Your next choice',({continue:'Continue',simplify:'Simplify',adjust:'Adjust',guidance:'Request guidance (not yet booked)'})[practice.next_choice]||practice.next_choice]];
    rows.forEach(([label,value])=>{const h=document.createElement('h3');h.textContent=label;const p=document.createElement('p');p.textContent=value;content.append(h,p)});
    status('Read-only reflection. Your completed chapter and reflection are preserved.');scrollTo(0,0);return;
  }
  if(localToday()<practice.review_date){
    const p=document.createElement('p');p.textContent='Your reflection opens on '+practice.review_date+'. Return to this page on or after that date. You do not need to restart your chapter or practice.';content.append(p);
    status('Your practice is registered. The reflection is not open yet.');scrollTo(0,0);return;
  }
  const form=document.createElement('form');form.noValidate=true;
  const addField=(label,kind,max=2500)=>{const l=document.createElement('label');l.textContent=label;const f=document.createElement(kind);f.required=true;if(kind==='textarea'){f.maxLength=max;f.rows=4;}form.append(l,f);return f};
  const daysLabel=document.createElement('label');daysLabel.textContent='On how many of the seven days did you practice (including a smaller version)?';const days=document.createElement('select');days.required=true;[['','Choose a number'],...Array.from({length:8},(_,i)=>[String(i),String(i)])].forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;days.append(o)});form.append(daysLabel,days);
  const outcome=addField('What actually happened? What did you notice compared with what you expected?','textarea');
  const body=addField('What did you notice in your mind or body, if anything?','textarea');
  const obstacles=addField('What supported you, and what got in the way?','textarea');
  const nextLabel=document.createElement('label');nextLabel.textContent='What would you like to choose next?';const next=document.createElement('select');next.required=true;[['','Choose your next step'],['continue','Continue this practice'],['simplify','Make it smaller or gentler'],['adjust','Adjust the approach'],['guidance','I would like guidance']].forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;next.append(o)});form.append(nextLabel,next);
  const note=document.createElement('p');note.className='muted';note.textContent='Your reflection is saved once and cannot be edited here. Choosing guidance records your interest only; it does not send a message or book an appointment. No automatic reminders are sent.';form.append(note);
  const submit=btn('Save my seven-day reflection →',()=>{},'primary');submit.type='submit';submit.onclick=null;form.append(submit);content.append(form);
  form.onsubmit=async e=>{e.preventDefault();if(days.value===''||!outcome.value.trim()||!body.value.trim()||!obstacles.value.trim()||!next.value){status('Please complete all five reflection answers. Zero days is a valid answer.');return}submit.disabled=true;status('Saving your reflection…');try{const r=await fetch(`${API}/stories/${encodeURIComponent(storyId)}/practices/${encodeURIComponent(practice.id)}/review`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({resume_token:token,days_practiced:Number(days.value),observed_outcome:outcome.value.trim(),mind_body_reflection:body.value.trim(),supports_obstacles:obstacles.value.trim(),next_choice:next.value})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'Reflection could not be confirmed');content.innerHTML='<h3>Your reflection is saved</h3><p>Your answers are preserved in your Story Vault. Your completed Chapter Five is unchanged.</p>';const b=btn('View my saved reflection →',showPracticeSetup,'primary');content.append(b);status('Seven-day reflection saved to your Story Vault.')}catch(err){submit.disabled=false;status('Reflection was not confirmed: '+err.message+'. Your answers are still on this page; please do not refresh.')}};
  status('Your seven-day reflection is open. Nothing is saved until you submit.');scrollTo(0,0);
}
function showCompletedCrossroads(){
  // Completed chapters are read-only. Do not call go(), save(), or persist().
  $('progress').textContent='Chapter Five · Your completed crossroads';
  $('screen').innerHTML='';
  let h=document.createElement('h2');h.textContent='Revisit your crossroads';$('screen').append(h);
  let intro=document.createElement('p');intro.textContent='Explore the paths you considered and the choice you saved. This review does not change your completed chapter.';$('screen').append(intro);
  Object.entries(paths).forEach(([id,config])=>{
    let section=document.createElement('section');
    let title=document.createElement('h3');title.textContent=config.title;section.append(title);
    let choice=document.createElement('p');choice.textContent=s.choices?.[id]?'Your discovery: '+s.choices[id]:'You did not record a discovery for this path.';section.append(choice);
    if(s.notes?.[id]){let note=document.createElement('p');note.textContent='Your words: '+s.notes[id];section.append(note)}
    if(s.path===id){let selected=document.createElement('p');selected.textContent='✦ Your chosen path';section.append(selected)}

  });
