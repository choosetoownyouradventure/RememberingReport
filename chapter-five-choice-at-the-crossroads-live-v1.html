<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter Five · The Choice at the Crossroads</title><style>:root{color-scheme:dark;--gold:#e5c37d;--ink:#f7f0e5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#243b50,#081523 75%);color:var(--ink);font:17px/1.7 Georgia,serif;min-height:100vh}.wrap{max-width:790px;margin:auto;padding:28px 18px 70px}header{text-align:center;padding:24px 0}header small,.eyebrow{color:var(--gold);letter-spacing:.18em;text-transform:uppercase;font:12px/1.5 Arial,sans-serif}h1{font-size:clamp(30px,6vw,52px);line-height:1.15;font-weight:normal;margin:12px 0}h2{font-weight:normal;color:var(--gold);font-size:30px;line-height:1.2}main{border:1px solid #856b43;border-radius:20px;padding:clamp(20px,5vw,46px);background:linear-gradient(145deg,#162b3c,#0d1a2a);box-shadow:0 25px 80px #0007}.scene{height:170px;border-radius:14px;margin-bottom:25px;background:radial-gradient(circle at 50% 35%,#f6dc9c 0 3%,#d3a86b 4%,transparent 21%),linear-gradient(145deg,transparent 48%,#192d28 49% 54%,transparent 55%),linear-gradient(215deg,transparent 48%,#203b31 49% 54%,transparent 55%),linear-gradient(#344a55,#172f32 55%,#0c1d29);position:relative;overflow:hidden}.scene:after{content:'✦     ✧        ✦       ✧';position:absolute;top:20px;left:10%;right:10%;text-align:center;color:#ffebba;letter-spacing:22px}.choice,button{display:block;width:100%;text-align:left;border:1px solid #a48a5b;border-radius:12px;background:#20364a;color:var(--ink);padding:15px 18px;margin:12px 0;font:inherit;cursor:pointer}.choice:hover,button:hover{background:#34516a}.choice.selected{border:2px solid var(--gold);background:#3a4651}button.primary{background:var(--gold);color:#172433;text-align:center;font-weight:bold}button.secondary{text-align:center;background:transparent}textarea,input[type=text]{width:100%;border:1px solid #a48a5b;border-radius:9px;background:#0b1a2a; </style></head><body><div class="wrap"><header><small>ISABELL · Choose to Own Your Adventure™</small><h1>Chapter Five</h1><div class="eyebrow">The Choice at the Crossroads</div></header><main><div class="scene" role="img" aria-label="Illustrated glowing forest crossroads"></div><div id="progress" class="progress"></div><div id="saveStatus" role="status" class="muted">Connecting to your Story Vault…</div><div id="screen" aria-live="polite"></div></main><p class="muted" style="text-align:center">Chapter Five · Your save status appears above the story.</p></div><script>(()=>{'use strict';const KEY='ctya_chapter5_'+(localStorage.getItem('ctya_story_id')||'missing'), API='https://remembering-story-api.choosetoownyouradventure.workers.dev', CHAPTER='choice_crossroads', VERSION='chapter5-v1', storyId=localStorage.getItem('ctya_story_id')||'', token=localStorage.getItem('ctya_resume_token')||'';let source={},serverReady=false,expired=false,saveTimer=null,saveChain=Promise.resolve(),lastSaved='';const status=(message)=>{$('saveStatus').textContent=message};const paths={thread:{title:'Follow the Thread',intro:'A fine golden thread glimmers between the trees. It does not pull you. It simply waits to be noticed.',question:'What is asking for your attention now?',options:['A question I want to understand','A gift I want to express','A truth I have been avoiding','I am not sure yet']},new:{title:'Choose a New Path',intro:'A path you have never walked opens beneath the morning light. You do not need to know the whole route to choose one step.',question:'Where might you make a different choice?',options:['Protect time for my own meaningful work','Express a need or boundary','Ask for support','Take one small creative step','I am not sure yet']},rest:{title:'Rest at the Crossroads',intro:'Beside the path is a quiet place to sit. Nothing asks you to prove that you deserve to stop.',question:'What would make rest a choice that belongs to you?',options:['Give myself permission to pause','Notice what I need before deciding','Set aside a nonurgent demand','Choose a gentle moment of care','I am not sure yet']}};let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch{}s=s&&s.version===1?s:{version:1,screen:'opening',name:'',path:null,explored:{},notes:{},choices:{},commitment:'',support:'',measure:'',finished:false};const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(s));if(serverReady&&!s.finished&&!expired){status('Saving your adventure…');clearTimeout(saveTimer);saveTimer=setTimeout(()=>persist(false),450)}}
function persist(complete=false,restart=false){clearTimeout(saveTimer);if(!serverReady&&!restart)return Promise.resolve(false);const snapshot=JSON.stringify({resume_token:token,version:VERSION,status:complete?'complete':'in_progress',restart,answers:{client:s},result:buildResult()});saveChain=saveChain.catch(()=>{}).then(async()=>{status('Saving your adventure…');try{const r=await fetch(`${API}/stories/${encodeURIComponent(storyId)}/chapters/${CHAPTER}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:snapshot});const d=await r.json();if(!r.ok||!d.success){if(d.expired)expired=true;throw Error(d.error||'Save failed')}lastSaved=d.saved_at||'';status(complete?'Chapter Five saved to your Story Vault.':'Your choices are saved in your Story Vault.');return true}catch(e){status('Your answers remain in this browser, but the Story Vault save was not confirmed: '+e.message);return false}});return saveChain}
function buildResult(){const c=s.choices||{},n=s.notes||{};return {chosen_path:s.path||null,discovery:c[s.path]||null,discovery_client_words:n[s.path]||null,chosen_action:n.action||null,constraint:n.constraint||null,support:n.support||null,success_indicator:n.measure||null,imagined_future:n.prediction||null,explored_paths:Object.keys(s.explored||{}).filter(k=>s.explored[k]),source_chapter_four:source,practitioner:{client_evidence:{chosen_path:s.path||null,discovery:c[s.path]||null,chosen_action:n.action||null,constraint:n.constraint||null,support:n.support||null,success_indicator:n.measure||null,imagined_future:n.prediction||null},interpretation:'Not generated; practitioner to explore with client.',follow_up_questions:['What happened when you tried your chosen action or pause?','Did your boundaries and constraints receive the respect they needed?']}}}function go(x){s.screen=x;save();render();scrollTo(0,0)}function btn(label,fn,cls='secondary'){let b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=fn;return b}function add(label,fn,cls){$('screen').append(btn(label,fn,cls))}function heading(title,text){$('screen').innerHTML=`<h2>${title}</h2><p>${text}</p>`}function field(label,key,placeholder='Your own words…'){let l=document.createElement('label');l.textContent=label;let t=document.createElement('textarea');t.placeholder=placeholder;t.value=s.notes[key]||'';t.oninput=()=>{s.notes[key]=t.value;save()};$('screen').append(l,t)}function options(items,key){items.forEach((v,i)=>{let b=btn(v,()=>{s.choices[key]=v;save();render()},'choice'+(s.choices[key]===v?' selected':''));b.setAttribute('aria-pressed',String(s.choices[key]===v));$('screen').append(b)})}function nav(back,next,enabled=true){let d=document.createElement('div');d.className='actions';d.append(btn('← Back',()=>go(back)));let n=btn('Turn the page →',()=>go(next),'primary');n.disabled=!enabled;d.append(n);$('screen').append(d)}function render(){let p=s.path,config=paths[p];$('progress').textContent=s.finished?'Chapter Five · Your closing page':s.screen==='opening'?'Chapter Five · Opening':s.screen==='crossroads'?'Chapter Five · The crossroads':s.screen==='path'?'Chapter Five · Exploring':s.screen==='choice'?'Chapter Five · Choosing':'Chapter Five · Integration';if(s.screen==='opening'){heading('The road remembers','You have named an old sentence, chosen new words, and noticed how a familiar moment can feel in your body. Now the road opens before you. You do not have to rush, prove anything, or know the ending.');$('screen').innerHTML+='<p class="quote">A choice can be small and still belong to you.</p>';add('Enter the crossroads →',()=>go('crossroads'),'primary')}else if(s.screen==='crossroads'){heading('Three paths. One traveler.','You may walk down each path to see what it reveals, then return here. Exploring is not a commitment. Your words will wait for you.');Object.entries(paths).forEach(([id,c])=>add((s.explored[id]?'✦ ':'◇ ')+c.title,()=>{s.path=id;save();go('path')},'choice'));if(s.path&&s.explored[s.path])add('Continue with '+paths[s.path].title+' →',()=>go('choice'),'primary')}else if(s.screen==='path'){heading(config.title,config.intro);$('screen').innerHTML+=`<p><strong>${config.question}</strong></p>`;options(config.options,p);field('What would you like to add? (optional)',p);add('Save this exploration and return to the crossroads',()=>{s.explored[p]=true;save();go('crossroads')});add('Choose this path →',()=>{if(!s.choices[p])return;s.explored[p]=true;save();go('choice')},'primary')}else if(s.screen==='choice'){heading('The choice belongs to you',`You explored <strong>${esc(config.title)}</strong>. You can still change your mind.`);$('screen').innerHTML+=`<div class="quote">${esc(s.choices[p]||'Your choice is still taking shape.')}</div>`;field('What is one small, realistic action—or intentional pause—you choose?', 'action','I choose to…');field('What real-life limitations, responsibilities, or personal boundaries does your next step need to respect? (optional)','constraint','For example: time, energy, finances, safety, or no particular constraints.');add('Explore another path',()=>go('crossroads'));add('Carry this choice forward →',()=>{if(!(s.notes.action||'').trim()){alert('Name a small action or intentional pause in your own words.');return}go('integration')},'primary')}else if(s.screen==='integration'){heading('Carry only what is yours','A choice is not a promise that everything will go perfectly. Give yourself a manageable way to notice what happens next.');field('What support, boundary, or reminder might help? (optional)','support');field('What would tell you this choice was useful to you? (optional)','measure');field('What do you imagine might happen? (optional)','prediction');add('← Revisit my choice',()=>go('choice'));add('Complete my chapter →',async()=>{if(!s.path||!s.choices[s.path]||!(s.notes.action||'').trim()){status('Choose a path and name your next action or pause first.');return}const ok=await persist(true);if(ok){s.finished=true;s.screen='complete';localStorage.setItem(KEY,JSON.stringify(s));render();scrollTo(0,0)}},'primary')}else{let title=paths[s.path]?.title||'Your path';heading('The Adventure Is Yours','The three paths meet in a golden clearing. You reach into your pocket and find the keepsake you have carried through your story. It has not chosen your road for you. It reminds you that the choice was yours all along.');let text=`You look back toward the path you chose: ${title}. Along the way, you noticed ${s.choices[s.path]||'something still taking shape'}.${s.notes[s.path]?' In your own words: '+s.notes[s.path]:''}\n\nNow you choose your next step or intentional pause: ${s.notes.action?'“'+s.notes.action.replace(/[.!?]+$/,'')+'”':'still taking shape'}. ${s.notes.constraint?'You named a boundary or limitation to honor: “'+s.notes.constraint.replace(/[.!?]+$/,'')+'.”':'You may name the practical boundaries your next step needs as they become clear.'}\n\nYou gather the support you named for the journey: ${s.notes.support?'“'+s.notes.support.replace(/[.!?]+$/,'')+'”':'support you may choose to identify as you continue'}. ${s.notes.measure?'You chose to pay attention to: “'+s.notes.measure.replace(/[.!?]+$/,'')+'.”':''} ${s.notes.prediction?'Looking beyond the clearing, you imagine: “'+s.notes.prediction.replace(/[.!?]+$/,'')+'.” This is a vision, not a promise.':''}\n\nYou close your hand around the keepsake. You have not reached the end of your adventure. You have reached the place where your choices begin to shape the next chapter. And this time, you are holding the pen.`;let pre=document.createElement('div');pre.className='summary';let subtitle=document.createElement('h3');subtitle.className='keepsake-subtitle';subtitle.textContent='The Lightbearer at the Golden Clearing';pre.append(subtitle,document.createTextNode(text));$('screen').append(pre);add('Print / save this chapter',()=>print(),'primary');add('Revisit my crossroads',()=>{showCompletedCrossroads();});add('Copy my keepsake',async()=>{try{await navigator.clipboard.writeText('The Lightbearer at the Golden Clearing\n\n'+text);alert('Keepsake copied.')}catch{alert('Select the keepsake text to copy it.')}})}  }
function showCompletedCrossroads(){
  // Completed chapters are read-only. Do not call go(), save(), or persist().
  $('progress').textContent='Chapter Five · Your completed crossroads';
  $('screen').innerHTML='';
  let h=document.createElement('h2');h.textContent='Revisit your crossroads';$('screen').append(h);
  let intro=document.createElement('p');intro.textContent='Explore the paths you considered and the choice you saved. This review does not change your completed chapter.';$('screen').append(intro);
  Object.entries(paths).forEach(([id,config])=>{
    let section=document.createElement('section');
    let title=document.createElement('h3');title.textContent=config.title;section.append(title);
    let choice=document.createElement('p');choice.textContent=s.choices?.[id]?'Your discovery: '+s.choices[id]:'You did not record a discovery for this path.';section.append(choice);
    if(s.notes?.[id]){let note=document.createElement('p');note.textContent='Your words: '+s.notes[id];section.append(note)}
    if(s.path===id){let selected=document.createElement('p');selected.textContent='✦ Your chosen path';section.append(selected)}
    $('screen').append(section);
  });
  let action=document.createElement('p');action.textContent='Your chosen action or pause: '+(s.notes?.action||'Not recorded');$('screen').append(action);
  add('← Return to my keepsake',()=>{s.screen='complete';render();scrollTo(0,0)},'primary');
  status('Read-only review. Your completed chapter remains unchanged.');
  scrollTo(0,0);
}
async function init(){if(!storyId||!token){status('Missing story ID or resume token. Open Chapter Five in the same browser where you completed Chapter Four.');$('screen').innerHTML='<h2>Story Vault connection needed</h2><p>Return to your saved story and open Chapter Five from there.</p>';return}try{const r=await fetch(`${API}/stories/${encodeURIComponent(storyId)}/chapters/${CHAPTER}?resume_token=${encodeURIComponent(token)}`,{cache:'no-store'});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'Could not load Chapter Five');if(d.exists&&d.chapter){if(d.chapter.version!==VERSION)throw Error('Saved chapter version does not match this page.');source=d.chapter.answers?.source||{};s={...s,...(d.chapter.answers?.client||{})};if(d.chapter.status==='complete'){s.finished=true;s.screen='complete'}else if(Date.now()-Date.parse(d.chapter.started_at)>=7*86400000){expired=true;status('Your seven-day window has ended. Your earlier answers are preserved.');$('screen').innerHTML='<h2>Your next adventure awaits</h2><p>Your seven-day window has ended. Start a new attempt to continue; your previous answers will be archived.</p>';add('Start a new seven-day attempt',async()=>{s={version:1,screen:'opening',path:null,explored:{},notes:{},choices:{},finished:false};serverReady=true;expired=false;const ok=await persist(false,true);if(ok){localStorage.setItem(KEY,JSON.stringify(s));render()}else{expired=true}} ,'primary');return}}else{source=d.initialization?.source||{};s={version:1,screen:'opening',path:null,explored:{},notes:{},choices:{},finished:false}}serverReady=true;localStorage.setItem(KEY,JSON.stringify(s));render();if(!d.exists)await persist(false);else status(s.finished?'Chapter Five completed and saved in your Story Vault.':'Your saved Chapter Five answers have been restored.')}catch(e){status('Could not connect to the Story Vault: '+e.message);$('screen').innerHTML='<h2>We could not open Chapter Five.</h2><p>Nothing has been erased. Confirm Chapter Four is complete and that you are using your original story browser.</p>'}}init()})();</script></body></html>
