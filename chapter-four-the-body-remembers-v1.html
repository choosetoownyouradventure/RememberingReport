<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter Four — The Body Remembers | Choose to Own Your Adventure™</title><style>
:root{
  --navy:#071d36; --navy2:#0d2948; --gold:#b78a2c; --gold2:#d0aa55;
  --paper:#fffdf7; --ink:#10233b; --muted:#647084; --line:#e7dcc3;
  --soft:#f7f0e2; --soft2:#f3f6f9; --danger:#8b2f2f; --ok:#315d45;
  --shadow:0 18px 55px rgba(7,29,54,.16);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,#071d36 0 190px,#f1ede5 190px 100%);color:var(--ink);font-family:Georgia,"Times New Roman",serif;min-height:100vh}
.shell{width:min(820px,calc(100% - 28px));margin:0 auto;padding:32px 0 54px}
.brand{color:#fff;text-align:center;margin:0 0 22px}
.brand .mark{font-size:.74rem;letter-spacing:.23em;text-transform:uppercase;color:#e5c879}
.brand h1{font-size:clamp(1.35rem,4vw,2rem);font-weight:500;letter-spacing:.06em;margin:.45rem 0 .15rem}
.brand p{margin:.15rem 0;color:#dbe4ee;font-size:.9rem}
.book{background:var(--paper);border:1px solid #eadfc9;box-shadow:var(--shadow);border-radius:16px;overflow:hidden}
.progress-wrap{padding:16px 22px 12px;border-bottom:1px solid var(--line);background:#fffefa}
.progress-meta{display:flex;justify-content:space-between;gap:12px;font:700 .7rem/1.2 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#7a6845}
.progress{height:4px;background:#ece7dd;border-radius:99px;margin-top:10px;overflow:hidden}
.progress>span{display:block;height:100%;width:8%;background:var(--gold);transition:width .25s ease}
.page{padding:clamp(28px,6vw,58px);min-height:610px}
.kicker{font:700 .72rem/1.2 Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:0 0 9px}
h2{font-size:clamp(2rem,6vw,3.25rem);font-weight:500;line-height:1.03;margin:.15rem 0 1.25rem;color:var(--navy)}
h3{font-size:1.42rem;margin:1.7rem 0 .65rem;color:var(--navy)}
p{font-size:1.06rem;line-height:1.72;margin:.75rem 0}
.lede{font-size:1.16rem}
.rule{border:0;border-top:1px solid var(--line);margin:28px 0}
.quote{margin:22px 0;padding:17px 19px;border-left:4px solid var(--gold);background:var(--soft);border-radius:0 8px 8px 0;font-size:1.05rem;line-height:1.55}
.quote strong{display:block;font-size:.82rem;margin-bottom:4px;color:var(--navy)}
.prompt{font-weight:700;margin-top:1.3rem}
.hint{font:italic .94rem/1.5 Georgia,serif;color:var(--muted);margin-top:6px}
label{display:block;font-weight:700;margin:18px 0 8px}
textarea,input[type="text"]{width:100%;border:1px solid #cfc7b8;border-radius:9px;background:#fff;padding:13px 14px;color:var(--ink);font:1rem/1.5 Georgia,serif;outline:none}
textarea{min-height:112px;resize:vertical}
textarea:focus,input[type="text"]:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(183,138,44,.12)}
.choices{display:grid;gap:10px;margin:15px 0}
.choice{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border:1px solid #d9d1c2;border-radius:9px;background:#fff;cursor:pointer;line-height:1.45}
.choice:hover{border-color:#b99a59;background:#fffaf0}
.choice input{margin-top:4px;accent-color:var(--navy)}
.path-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
.path{border:1px solid #d9ccb2;background:#fffaf0;border-radius:12px;padding:18px;cursor:pointer;text-align:left;color:var(--ink);font-family:Georgia,serif}
.path:hover,.path.selected{border-color:var(--gold);box-shadow:0 0 0 2px rgba(183,138,44,.12)}
.path b{display:block;color:var(--navy);margin-bottom:6px;font-size:1.02rem}
.path span{font-size:.9rem;line-height:1.45;color:#5f6670}
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:5px;margin:13px 0 5px}
.scale button{border:1px solid #d4ccbd;background:#fff;border-radius:7px;padding:10px 2px;cursor:pointer;color:var(--navy);font-weight:700}
.scale button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.scale-labels{display:flex;justify-content:space-between;color:var(--muted);font: .76rem/1.3 Arial,sans-serif}
.rewrite-option{display:block;border:1px solid #d7c8a9;border-radius:11px;padding:16px;margin:11px 0;background:#fffaf0;cursor:pointer}
.rewrite-option.selected{border:2px solid var(--gold);padding:15px}
.rewrite-option small{display:block;font:700 .68rem/1.2 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#8b6d2f;margin-bottom:6px}
.summary{display:grid;gap:12px;margin:22px 0}
.summary-card{padding:15px 17px;background:var(--soft);border-left:3px solid var(--gold);border-radius:0 8px 8px 0}
.summary-card b{display:block;font:700 .72rem/1.2 Arial,sans-serif;letter-spacing:.11em;text-transform:uppercase;color:#7b6330;margin-bottom:5px}
.actions{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:30px;flex-wrap:wrap}
button.primary,button.secondary{border-radius:8px;padding:12px 18px;font:700 .82rem/1 Arial,sans-serif;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
button.primary{background:var(--navy);color:#fff;border:1px solid var(--navy)}
button.secondary{background:#fff;color:var(--navy);border:1px solid #cdbb96}
button:disabled{opacity:.45;cursor:not-allowed}
.status{font: .82rem/1.4 Arial,sans-serif;color:var(--muted);padding:10px 12px;background:var(--soft2);border-radius:7px;margin-top:18px}
.status.error{color:var(--danger);background:#fff1ef}
.status.ok{color:var(--ok);background:#eff8f2}
.hidden{display:none!important}
.footer{text-align:center;color:#59687a;font: .76rem/1.5 Arial,sans-serif;padding:20px 25px;border-top:1px solid var(--line);background:#fffefa}
.loading{padding:70px 30px;text-align:center}
.loading h2{font-size:1.8rem}
.spinner{width:32px;height:32px;border:3px solid #e5dccb;border-top-color:var(--gold);border-radius:50%;margin:0 auto 18px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:680px){.path-grid{grid-template-columns:1fr}.page{min-height:0}.scale{gap:3px}.scale button{font-size:.75rem;padding:9px 0}.shell{width:min(100% - 16px,820px);padding-top:18px}}
@media print{body{background:#fff}.brand,.progress-wrap,.actions,.footer,.status{display:none!important}.shell{width:100%;padding:0}.book{box-shadow:none;border:0}.page{padding:20px}}

.optional{font-size:.87rem;color:var(--muted)}.choice:focus-within{outline:2px solid var(--gold)}.summary-card{overflow-wrap:anywhere}#page{min-height:570px}</style></head><body><div class="shell"><header class="brand"><div class="mark">Choose to Own Your Adventure™</div><h1>THE REMEMBERING REPORT</h1><p>A reflective coaching journey</p></header><main class="book"><div id="loading" class="loading"><div class="spinner"></div><h2>Opening Chapter Four…</h2><p>Gathering the words you chose.</p></div><div id="app" class="hidden"><div class="progress-wrap"><div class="progress-meta"><span>Chapter Four · The Body Remembers</span><span id="pageLabel">Page 1</span></div><div class="progress"><span id="progressBar"></span></div></div><section id="page" class="page" aria-live="polite"></section><footer class="footer">A reflective coaching experience, not diagnosis or treatment. All exercises are optional.</footer></div></main></div><script>
(()=>{"use strict";
const API="https://remembering-story-api.choosetoownyouradventure.workers.dev", KEY="body_remembers", VERSION="chapter4-v1";
const storyId=localStorage.getItem("ctya_story_id")||"",token=localStorage.getItem("ctya_resume_token")||"",name=localStorage.getItem("ctya_first_name")||"Traveler",localKey=`ctya_chapter4_${storyId}`;
const pages=["opening","echo","notice","response","sanctuary","signature","experiment","integration","complete"];
const choices={echo:["A manageable everyday moment","How I feel right now","The gentlest route — no body scan"],notice:["Chest or breathing","Stomach or abdomen","Shoulders, neck or jaw","Hands, arms or legs","Somewhere else","A thought, emotion or change in attention","Nothing noticeable / unsure","Skip this question"],response:["I get busy or try to control things","I withdraw or become quiet","I seek reassurance or try to please","I want to leave or change the situation","Something else","Unsure / skip"],sanctuary:["Notice three things around me","Change position or move gently","Rest in stillness","Use a meaningful word or object","Skip this exercise"],signature:["Open my hands gently","Sit or stand in a comfortable posture","A small gesture I choose","A phrase instead of movement","No signature move right now"],experiment:["Once in the morning","When I notice a familiar response","Before one meaningful activity","A flexible schedule","No experiment right now"],integration:["I can notice without judging","I can choose a small action","I can honor my limits","I am still exploring","My own words"]};
const prompts={echo:"Describe a small, manageable situation, if you wish.",notice:"What did you notice, in your own words? You can describe a thought rather than a sensation.",response:"What tends to happen next? No interpretation is required.",sanctuary:"How did this option feel? You may stop or skip at any time.",signature:"Choose a phrase or intention that feels believable to you.",experiment:"What is one small action, and what might make it realistic?",integration:"Complete this sentence if you wish: My body and I can…"};
const titles={opening:"The page beneath the words",echo:"The Echo",notice:"The Body’s Whisper",response:"The Familiar Response",sanctuary:"Choose Your Sanctuary",signature:"The Signature Move",experiment:"A Seven-Day Invitation",integration:"The Body’s New Message"};
const text={opening:"You have rewritten a sentence from your story. Yet understanding a thought does not require your feelings or sensations to change on command. In this chapter, you may notice your experience, choose what feels comfortable, and leave any question unanswered. You are the author of this page.",echo:"A small moment is enough. You do not need to revisit a painful memory. You can use a fictional example, focus on the present, or take the gentlest path.",notice:"You may notice tension, ease, energy, a thought, or nothing at all. None of these answers proves what caused your experience. You can reflect without scanning your body.",response:"A familiar reaction might show up as activity, quietness, reassurance-seeking, or something else. Recognizing it is not the same as judging it or assigning it a diagnosis.",sanctuary:"Choose a comfortable option. No forced breathing, stretching, or emotional change is required. If an exercise feels unpleasant, stop and choose another route.",signature:"Pair your emerging truth with a tiny gesture or phrase, if you want one. It is a reminder of your chosen intention, not a promise to change your nervous system.",experiment:"You may test one manageable practice over the next seven days. Missing a day is information, not failure. You may also choose not to run an experiment.",integration:"You have explored what you noticed and what you would like to carry forward. Your experience belongs to you; this chapter offers observations, not a verdict."};
let source={},client={current_step:"opening",choices:{},notes:{}},result={},idx=0,timer=null,completed=false;
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const page=()=>pages[idx],el=id=>document.getElementById(id);
function localSave(){try{localStorage.setItem(localKey,JSON.stringify({version:VERSION,client,result,updated_at:new Date().toISOString()}))}catch{}}
function status(msg,kind=""){const e=el("saveStatus");if(e){e.textContent=msg;e.className=`status ${kind}`}}
async function save(state="in_progress",data={}){localSave();status("Saving your place…");try{const r=await fetch(`${API}/stories/${encodeURIComponent(storyId)}/chapters/${KEY}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({resume_token:token,version:VERSION,status:state,answers:{client},result:data})});const body=await r.json();if(!r.ok||!body.success)throw Error(body.error||"Save failed");status(state==="complete"?"Chapter Four saved to your Story Vault.":"Your place is saved.","ok");return true}catch(e){status(`Saved in this browser, but not to the Story Vault: ${e.message}`,"error");return false}}
function queue(){localSave();clearTimeout(timer);timer=setTimeout(()=>save(),650)}
function update(){el("pageLabel").textContent=page()==="complete"?"Complete":`Page ${idx+1} of ${pages.length-1}`;el("progressBar").style.width=`${Math.round(idx/(pages.length-1)*100)}%`}
function controls(){return `<div id="saveStatus" class="status">Your answers belong to your Remembering Story.</div><div class="actions">${idx?'<button type="button" class="secondary" id="back">← Previous page</button>':''}<button type="button" class="primary" id="next">${idx===pages.length-2?"Complete Chapter Four →":"Turn the page →"}</button></div>`}
function render(){update();const key=page();if(key==="complete"){finishView();return}let out=`<div class="kicker">Chapter Four · ${idx+1} of ${pages.length-1}</div><h2>${titles[key]}</h2><p class="lede">${text[key]}</p>`;
if(key==="opening"){out+=`<div class="quote"><strong>Your chosen rewrite</strong>${esc(source.chosen_rewrite||source.bridge_belief||"Your words will appear here when your previous chapter has been saved.")}</div><p class="optional">This chapter is voluntary. Choose a gentle route, skip questions, or stop at any point. Physical symptoms can have many causes; this exercise does not identify their cause.</p>`}
else{if(key==="echo"&&source.old_spell)out+=`<div class="quote"><strong>The old sentence you identified</strong>${esc(source.old_spell)}</div>`;if(key==="signature"&&source.chosen_rewrite)out+=`<div class="quote"><strong>The words you chose</strong>${esc(source.chosen_rewrite)}</div>`;out+=`<p class="prompt">${{echo:"Where would you like to begin?",notice:"What stands out to you?",response:"Which response, if any, seems familiar?",sanctuary:"What would you prefer right now?",signature:"What might help you remember your intention?",experiment:"What feels realistic for the next seven days?",integration:"What will you carry forward?"}[key]}</p><div class="choices">${choices[key].map((option,i)=>`<label class="choice"><input type="radio" name="choice" value="${i}" ${client.choices[key]===option?"checked":""}>${esc(option)}</label>`).join("")}</div><label for="note">${prompts[key]} <span class="optional">(optional)</span></label><textarea id="note" maxlength="2500" placeholder="Your words, if you choose…">${esc(client.notes[key]||"")}</textarea>`}
out+=controls();el("page").innerHTML=out;const note=el("note");if(note)note.oninput=e=>{client.notes[key]=e.target.value;queue()};document.querySelectorAll('input[name="choice"]').forEach(e=>e.onchange=()=>{client.choices[key]=choices[key][Number(e.value)];queue()});const back=el("back");if(back)back.onclick=()=>{clearTimeout(timer);idx--;client.current_step=page();queue();render();window.scrollTo(0,0)};el("next").onclick=async()=>{if(key!=="opening"&&!client.choices[key]){status("Choose an option, including a skip or unsure option if you prefer.","error");return}if(idx===pages.length-2){result=buildResult();const ok=await save("complete",result);if(!ok){status("Please retry saving before completing the chapter.","error");return}completed=true}idx++;client.current_step=page();localSave();if(!completed)queue();render();window.scrollTo(0,0)};}
function buildResult(){const c=client.choices,n=client.notes;return {somatic_entry:c.echo||null,body_cue:c.notice||null,body_cue_client_words:n.notice||null,response_pattern:c.response||null,response_client_words:n.response||null,regulation_choice:c.sanctuary||null,regulation_feedback:n.sanctuary||null,signature_move:c.signature||null,signature_intention:n.signature||source.bridge_belief||source.chosen_rewrite||null,embodiment_plan:c.experiment||null,embodiment_detail:n.experiment||null,client_reflection:n.integration||c.integration||null,prior_chapter_rewrite:source.chosen_rewrite||null,practitioner_notes:{client_reported_observations:[n.notice,n.response,n.sanctuary].filter(Boolean),support_preferences:[c.sanctuary,c.signature].filter(Boolean),possible_pattern_connections:[],follow_up_questions:["Did the client find the chosen practice comfortable and useful?","Would the client prefer to change or discontinue it?"]},handoff:{chosen_rewrite:source.chosen_rewrite||null,signature_move:c.signature||null,signature_intention:n.signature||null,embodiment_plan:c.experiment||null,client_reflection:n.integration||c.integration||null}}}
function finishView(){const r=Object.keys(result).length?result:buildResult();el("page").innerHTML=`<div class="kicker">Chapter Four Complete</div><h2>You can listen without surrendering your choices.</h2><p>${esc(name)}, you explored your experience on your own terms. You were free to notice, choose, or skip. There is no required sensation or correct outcome.</p><div class="summary"><div class="summary-card"><b>What you noticed</b>${esc(r.body_cue||"Not recorded")}${r.body_cue_client_words?`<p>${esc(r.body_cue_client_words)}</p>`:""}</div><div class="summary-card"><b>A familiar response</b>${esc(r.response_pattern||"Not recorded")}</div><div class="summary-card"><b>Your chosen support</b>${esc(r.regulation_choice||"Not recorded")}</div><div class="summary-card"><b>Your signature reminder</b>${esc(r.signature_move||"Not recorded")}${r.signature_intention?`<p>${esc(r.signature_intention)}</p>`:""}</div><div class="summary-card"><b>Your seven-day invitation</b>${esc(r.embodiment_plan||"Not recorded")}${r.embodiment_detail?`<p>${esc(r.embodiment_detail)}</p>`:""}</div><div class="summary-card"><b>Your message</b>${esc(r.client_reflection||"Still taking shape")}</div></div><hr class="rule"><div class="kicker">At the crossroads</div><h3>What happens when your new choice meets the real world?</h3><p>You have changed the words and explored how you experience the moment. But what happens when someone expects the old version of you—or when a familiar choice returns?</p><p>In the next chapter, the traveler finds a crossroads. Not every road needs to be taken. The question is: <b>Which choice belongs to you?</b></p><h3>Chapter Five · The Choice at the Crossroads →</h3><div id="saveStatus" class="status ok">${completed?"Chapter Four saved to your Story Vault.":"This chapter was previously completed."}</div><div class="actions"><button class="secondary" id="print">Print / Save This Chapter</button><button class="primary" id="review">Revisit Chapter Four</button></div>`;el("print").onclick=()=>window.print();el("review").onclick=()=>{idx=1;client.current_step=page();localSave();render()}}
async function init(){if(!storyId||!token){el("loading").innerHTML="<h2>Your saved story could not be identified.</h2><p>Open this chapter in the browser where you completed Chapter Three.</p>";return}try{const r=await fetch(`${API}/stories/${encodeURIComponent(storyId)}/chapters/${KEY}?resume_token=${encodeURIComponent(token)}`,{cache:"no-store"});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||"Could not open this chapter");if(d.exists&&d.chapter){if(d.chapter.version!==VERSION)throw Error("Saved chapter version does not match this page.");source=d.chapter.answers?.source||{};client={current_step:"opening",choices:{},notes:{},...(d.chapter.answers?.client||{})};result=d.chapter.result||{};completed=d.chapter.status==="complete"}else{source=d.initialization?.source||{};try{const cached=JSON.parse(localStorage.getItem(localKey)||"null");if(cached?.version===VERSION)client={...client,...cached.client}}catch{}}idx=pages.indexOf(client.current_step);if(idx<0)idx=0;if(completed){idx=pages.length-1;client.current_step="complete"}el("loading").classList.add("hidden");el("app").classList.remove("hidden");render()}catch(e){el("loading").innerHTML=`<h2>We couldn't open Chapter Four.</h2><p>${esc(e.message)}</p><p>Nothing has been erased. Verify that Chapter Three has been completed and saved.</p>`}}
init();
})();
</script></body></html>
